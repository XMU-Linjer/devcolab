groups:
  - name: devcollab-local
    rules:
      - alert: DevCollabServiceDown
        expr: up{job=~"devcollab-.*"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "DevCollab service {{ $labels.job }} is unavailable"

      - alert: DevCollabHighHttp5xxRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DevCollab {{ $labels.application }} HTTP 5xx ratio exceeds 5%"

      - alert: DevCollabWorkerDlqActivity
        expr: increase(devcollab_worker_kafka_dlq_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "DevCollab Worker routed events to the DLQ"

name: devcollab

services:
  postgres:
    image: postgres:17-alpine
    container_name: devcollab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devcollab}
      POSTGRES_USER: ${POSTGRES_USER:-devcollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcollab}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

  redis:
    image: redis:8-alpine
    container_name: devcollab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcollab-local

volumes:
  postgres-data:
  redis-data:

networks:
  devcollab-local:
    name: devcollab-local

